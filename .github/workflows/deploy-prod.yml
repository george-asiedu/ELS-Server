name: Deploy production (Contabo VPS)

# main deploys to the VPS: build the image, push it to GitHub Container
# Registry, then on the server apply database migrations and restart.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/els-server
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.event.workflow_run.head_sha || github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Copy compose files to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy/docker-compose.prod.yml,deploy/Caddyfile,deploy/db-backup.sh
          target: /opt/zuri
          strip_components: 1

      - name: Migrate and restart
        uses: appleboy/ssh-action@v1.2.0
        env:
          API_IMAGE: ${{ env.IMAGE }}:${{ github.event.workflow_run.head_sha || github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: API_IMAGE,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd /opt/zuri
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export API_IMAGE
            docker compose -f docker-compose.prod.yml pull api
            # A restorable copy before any schema change; keeps the latest 14.
            mkdir -p backups
            docker compose -f docker-compose.prod.yml up -d --wait db
            docker compose -f docker-compose.prod.yml exec -T db \
              pg_dump -U zuri -Fc zuri > "backups/pre-${API_IMAGE##*:}.dump"
            ls -1t backups/pre-*.dump | tail -n +15 | xargs -r rm --
            # Schema changes first; the old version keeps serving until this passes.
            docker compose -f docker-compose.prod.yml run --rm api npx prisma migrate deploy
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
