name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      # prisma generate reads the config, which needs the variable to exist.
      # It never connects, so a placeholder is enough. No secrets in the build.
      - run: yarn build
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
