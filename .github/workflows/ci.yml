name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      # prisma generate reads the config, which needs the variable to exist.
      # It never connects, so a placeholder is enough. No secrets in the build.
      - run: yarn build
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build

  # The develop branch deploys to Render, only after the checks pass. Turn OFF
  # auto-deploy in the Render service so this is the only trigger. This lives
  # here (not in a workflow_run file) because GitHub only runs workflow_run
  # files that are on the default branch.
  deploy-dev:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Trigger Render deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
