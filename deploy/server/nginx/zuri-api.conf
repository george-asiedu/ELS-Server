# Nginx in front of the Zuri API. Installed by setup.sh as
# /etc/nginx/sites-available/zuri-api.conf (__API_DOMAIN__ filled in).
# Starts as plain HTTP; `certbot --nginx -d __API_DOMAIN__ --redirect` then adds
# HTTPS and keeps the certificate renewed. The API has its own per-account
# limits; this stops a flood before it reaches Node.

limit_req_zone $binary_remote_addr zone=zuri_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=zuri_auth:10m rate=10r/m;

upstream zuri_api {
    server 127.0.0.1:5060;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name __API_DOMAIN__;

    # Image uploads go straight from the browser to S3; requests here are JSON.
    client_max_body_size 2m;

    access_log /var/log/nginx/zuri-api.access.log;
    error_log  /var/log/nginx/zuri-api.error.log warn;

    location ~ ^/api/(platform/)?auth/(login|forgot-password|reset-password) {
        limit_req zone=zuri_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://zuri_api;
        include /etc/nginx/snippets/nichelle-proxy.conf;
    }

    location / {
        limit_req zone=zuri_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://zuri_api;
        include /etc/nginx/snippets/nichelle-proxy.conf;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
