# Production stack on the Contabo VPS: API, Postgres, Redis, nightly backups
# and Caddy. Lives at /opt/zuri on the server with a
# .env next to it (see docs/DEPLOYMENT.md). The deploy workflow sets
# API_IMAGE to the image it just pushed.
services:
  api:
    image: ${API_IMAGE:-ghcr.io/OWNER/els-server:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "5000"
      REDIS_URL: redis://redis:6379
      SCHEDULER_ENABLED: "true"
      TRUST_PROXY_HOPS: "1"
      # The database runs beside the API; it isn't reachable from outside.
      DATABASE_URL: postgresql://zuri:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/zuri
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "5000"

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zuri
      POSTGRES_DB: zuri
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # Sized for the 8 GB / 4-core VPS, leaving room for the API and Redis.
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=100
    shm_size: 256mb
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zuri -d zuri"]
      interval: 5s
      timeout: 5s
      retries: 10

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: zuri
      POSTGRES_DB: zuri
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    entrypoint: ["sh", "/db-backup.sh"]
    volumes:
      - ./db-backup.sh:/db-backup.sh:ro
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data

  # HTTPS for api.<domain>, certificates handled automatically.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  db-data:
  redis-data:
  caddy-data:
  caddy-config:
